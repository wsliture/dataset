server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 26m;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $dataset_api http://api:4190;
        proxy_pass $dataset_api;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
