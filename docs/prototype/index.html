<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>历史数据集 · SunwiseMatriX TR</title>
    <style>
      :root {
        --primary: #1677ff;
        --bg: #eef3f8;
        --ink: #1d2b40;
        --muted: #718096;
        --line: #dfe6ef;
        --soft: #f6f8fb;
        --blue: #e6f4ff;
        --radius: 8px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--bg);
        font:
          14px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      select,
      input[type="checkbox"] {
        cursor: pointer;
      }
      button {
        border: 1px solid #d9d9d9;
        border-radius: 6px;
        background: white;
        color: var(--ink);
        padding: 5px 13px;
        min-height: 32px;
        white-space: nowrap;
      }
      button:hover {
        color: var(--primary);
        border-color: var(--primary);
      }
      button:disabled {
        cursor: not-allowed;
        background: #f5f5f5;
        border-color: #ddd;
        color: #aaa;
      }
      button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
        box-shadow: 0 2px 0 #0591ff1a;
      }
      button.text {
        border-color: transparent;
        background: transparent;
        color: var(--primary);
        padding: 2px 7px;
      }
      button.danger {
        color: #cf1322;
      }
      button.icon {
        padding: 2px 9px;
      }
      a {
        color: var(--primary);
        text-decoration: none;
      }
      input:not([type="checkbox"]),
      select,
      textarea {
        border: 1px solid #d9d9d9;
        border-radius: 6px;
        background: white;
        padding: 6px 10px;
        color: var(--ink);
        min-width: 0;
        max-width: 100%;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: 0;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px #1677ff18;
      }
      input[type="checkbox"] {
        accent-color: var(--primary);
        width: 15px;
        height: 15px;
        flex: none;
      }
      textarea {
        resize: vertical;
        width: 100%;
      }
      :focus-visible {
        outline: 2px solid #1677ff;
        outline-offset: 3px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 23px;
        letter-spacing: 0.2px;
      }
      h2 {
        font-size: 17px;
      }
      h3 {
        font-size: 14px;
      }
      .muted,
      small {
        color: var(--muted);
      }
      small {
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .spread {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        border: 1px solid #d9e3ef;
        background: #f6f8fb;
        border-radius: 4px;
        padding: 0 7px;
        line-height: 22px;
        font-size: 12px;
        white-space: nowrap;
        color: #59718a;
      }
      .tag.blue {
        color: #0958d9;
        background: #e6f4ff;
        border-color: #91caff;
      }
      .tag.green {
        color: #389e0d;
        background: #f6ffed;
        border-color: #b7eb8f;
      }
      .tag.gold {
        color: #ad6800;
        background: #fffbe6;
        border-color: #ffe58f;
      }
      .tag.red {
        color: #cf1322;
        background: #fff1f0;
        border-color: #ffa39e;
      }
      .header {
        height: 64px;
        background: #001529;
        color: white;
        padding: 0 28px;
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .brand {
        font-weight: 700;
        font-size: 20px;
        color: white;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #244766;
      }
      .container {
        padding: 20px 28px 90px;
        max-width: 1800px;
        margin: auto;
      }
      .breadcrumb {
        color: #7e8ea1;
        font-size: 12px;
        margin-bottom: 9px;
      }
      .breadcrumb button {
        font-size: 12px;
        padding: 0;
        min-height: 20px;
      }
      .page-title {
        margin-bottom: 16px;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--line);
        gap: 28px;
        margin: 14px 0 16px;
      }
      .tabs button {
        border: 0;
        background: none;
        border-radius: 0;
        padding: 9px 0;
        color: #63758c;
      }
      .tabs button.active {
        color: var(--primary);
        border-bottom: 2px solid var(--primary);
        font-weight: 600;
      }
      .notice {
        background: #eaf4ff;
        border: 1px solid #cce3ff;
        border-radius: 6px;
        padding: 8px 12px;
        color: #456b97;
        font-size: 12px;
        margin-bottom: 12px;
      }
      .notice.warn {
        background: #fffbe6;
        border-color: #ffe58f;
        color: #916300;
      }
      .notice.error {
        background: #fff1f0;
        border-color: #ffccc7;
        color: #b42332;
      }
      .panel {
        background: white;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 2px 6px #24476604;
        overflow: hidden;
      }
      .panel-head {
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      .workspace {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .doc-pane {
        min-width: 0;
      }
      .side-dot {
        width: 26px;
        height: 26px;
        background: #e6f4ff;
        color: #1677ff;
        display: grid;
        place-items: center;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
      }
      .side-dot.output {
        background: #f0f5ff;
        color: #597ef7;
      }
      .doc-controls {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }
      .doc-controls select:first-child {
        flex: 1;
        width: 65%;
        font-size: 12px;
      }
      .doc-controls input {
        width: 100%;
        font-size: 12px;
        margin-top: 8px;
      }
      .reader {
        display: grid;
        grid-template-columns: 156px minmax(0, 1fr);
        height: 435px;
      }
      .tree {
        background: #fbfcfe;
        border-right: 1px solid var(--line);
        padding: 12px 8px;
        overflow: auto;
      }
      .tree-title {
        font-size: 11px;
        color: #8b9aad;
        letter-spacing: 1px;
        padding: 0 7px 8px;
      }
      .tree button {
        white-space: normal;
        text-align: left;
        background: none;
        border: 0;
        width: 100%;
        font-size: 12px;
        padding: 8px;
        line-height: 1.6;
        margin-bottom: 3px;
      }
      .tree button.active {
        background: #e6f4ff;
        color: #0958d9;
      }
      .paper {
        padding: 14px 16px;
        overflow: auto;
        scroll-behavior: smooth;
      }
      .section-title {
        margin: 0 0 13px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e8edf3;
      }
      .section-title h3 {
        font-size: 14px;
      }
      .unit {
        padding: 10px 10px 8px;
        border: 1px solid transparent;
        border-radius: 5px;
        margin: 4px 0;
        position: relative;
      }
      .unit:hover {
        background: #f8faff;
        border-color: #d6e6ff;
      }
      .unit.selected {
        background: #edf6ff;
        border-color: #91caff;
      }
      .unit-meta {
        font-size: 10px;
        color: #8091a6;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 5px;
      }
      .unit-meta button {
        font-size: 10px;
        min-height: 20px;
      }
      .prose {
        font-family: "Times New Roman", "SimSun", "宋体", serif;
        font-size: 15px;
        line-height: 1.8;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .table-scroll {
        overflow-x: auto;
        max-width: 100%;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      td,
      th {
        border: 1px solid var(--line);
        padding: 8px;
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      th {
        background: #f6f8fb;
        color: #53657b;
        font-weight: 500;
      }
      .source-table {
        min-width: 370px;
      }
      .source-table td {
        font-family: "SimSun", serif;
        min-width: 55px;
      }
      .source-table tr.selected {
        background: #d9edff;
      }
      .source-table .check-cell {
        width: 27px;
        min-width: 27px;
        padding: 5px;
      }
      .pane-footer {
        padding: 7px 14px;
        background: #fcfdff;
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: #8b99ac;
      }
      .selection-panel {
        margin-top: 14px;
      }
      .selection-summary {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 12px 18px;
        cursor: pointer;
      }
      .selection-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 0 18px 15px;
      }
      .selection-group {
        border: 1px solid var(--line);
        border-radius: 6px;
        margin-bottom: 8px;
        overflow: hidden;
      }
      .selection-group header {
        padding: 7px 10px;
        background: #f8faff;
        font-size: 12px;
      }
      .selection-item {
        padding: 7px 10px;
        border-top: 1px solid #eef1f5;
        font-size: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .selection-item .snippet {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .gap {
        padding: 3px 12px;
        color: #9aa6b5;
        background: #fafbfd;
        font-size: 11px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1.35fr 1fr 1.3fr;
        gap: 13px 20px;
        padding: 16px 18px;
      }
      .field label {
        display: block;
        font-size: 12px;
        margin-bottom: 5px;
        color: #5b6c81;
      }
      .field input {
        width: 100%;
      }
      .required {
        color: #ff4d4f;
        margin-right: 3px;
      }
      .categories {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .categories button {
        font-size: 11px;
        padding: 1px 7px;
        min-height: 25px;
      }
      .categories button.active {
        background: #e6f4ff;
        border-color: #91caff;
        color: #0958d9;
      }
      .form-panel {
        margin-top: 14px;
      }
      .bottom-bar {
        position: fixed;
        z-index: 10;
        bottom: 0;
        left: 0;
        right: 0;
        background: #ffffffef;
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--line);
        padding: 12px 28px;
        display: flex;
        gap: 12px;
        align-items: center;
        box-shadow: 0 -3px 12px #17365305;
      }
      .bottom-bar small {
        margin-right: auto;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 18px;
      }
      .stat {
        padding: 16px 20px;
      }
      .stat strong {
        display: block;
        font-size: 28px;
        font-weight: 600;
        margin-top: 5px;
      }
      .stat small {
        font-size: 12px;
      }
      .toolbar {
        padding: 14px 18px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .toolbar input {
        min-width: 220px;
      }
      .list-table td,
      .list-table th {
        border-left: 0;
        border-right: 0;
        padding: 15px 18px;
      }
      .list-table th {
        font-size: 12px;
      }
      .list-table td {
        font-size: 13px;
      }
      .list-table .name {
        font-weight: 600;
        color: #1d3858;
      }
      .pagination {
        padding: 13px 18px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 9px;
        font-size: 12px;
      }
      .empty {
        padding: 60px 20px;
        text-align: center;
        color: #8b99aa;
      }
      .empty b {
        display: block;
        color: #627892;
        margin: 12px;
      }
      .doc-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .doc-card {
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }
      .doc-card:last-child {
        border: 0;
      }
      .doc-card .file-name {
        font-weight: 500;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .doc-card .row {
        margin-top: 8px;
      }
      .doc-card .row:first-child {
        margin-top: 0;
      }
      .steps {
        display: flex;
        gap: 20px;
        font-size: 12px;
        color: #8b99aa;
        margin: 10px 0 16px;
      }
      .steps .current {
        color: #1677ff;
        font-weight: 600;
      }
      .mobile-switch {
        display: none;
      }
      .dialog {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0;
        width: 760px;
        max-width: calc(100vw - 32px);
        max-height: 88vh;
        color: var(--ink);
        box-shadow: 0 18px 70px #00152933;
      }
      .dialog::backdrop {
        background: #00152966;
      }
      .dialog-header {
        padding: 16px 22px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .dialog-body {
        padding: 20px 22px;
        overflow: auto;
        max-height: calc(88vh - 135px);
      }
      .dialog-footer {
        border-top: 1px solid var(--line);
        padding: 13px 22px;
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .dialog .field {
        margin-bottom: 14px;
      }
      .preview-doc {
        margin-bottom: 18px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
      }
      .preview-doc h3 {
        margin-bottom: 10px;
      }
      .preview-unit {
        border-top: 1px solid var(--line);
        padding: 10px 0;
      }
      .context {
        background: #f6f8fb;
        border-left: 2px solid #b7c7da;
        padding: 8px 10px;
        margin-top: 8px;
        font-size: 12px;
        color: #6c7e94;
      }
      .confirm-check {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-top: 12px;
      }
      .toast {
        position: fixed;
        z-index: 100;
        top: 82px;
        left: 50%;
        transform: translateX(-50%);
        padding: 11px 20px;
        background: #fff;
        border: 1px solid #d9e6f4;
        box-shadow: 0 5px 25px #00152922;
        border-radius: 8px;
        max-width: 90vw;
      }
      .toast:empty {
        display: none;
      }
      .readonly-banner {
        margin-bottom: 10px;
      }
      .source-note {
        font-size: 11px;
        color: #9a7c3d;
      }
      .hit {
        background: #fff1b8;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      @media (min-width: 1600px) {
        .reader {
          height: 490px;
        }
        .tree {
          padding: 14px;
        }
        .reader {
          grid-template-columns: 180px minmax(0, 1fr);
        }
      }
      @media (max-width: 1280px) {
        .container {
          padding: 16px 18px 85px;
        }
        .reader {
          grid-template-columns: 132px minmax(0, 1fr);
        }
        .paper {
          padding: 12px;
        }
        .header {
          padding: 0 18px;
        }
        .form-grid {
          gap: 12px;
        }
        .doc-controls select {
          max-width: 76%;
        }
      }
      @media (max-width: 900px) {
        .header {
          gap: 14px;
        }
        .workspace,
        .selection-grid,
        .doc-list {
          grid-template-columns: 1fr;
        }
        .doc-pane {
          display: none;
        }
        .doc-pane.mobile-active {
          display: block;
        }
        .mobile-switch {
          display: flex;
          gap: 8px;
          margin: 10px 0;
        }
        .mobile-switch .active {
          color: var(--primary);
          border-color: var(--primary);
        }
        .form-grid {
          grid-template-columns: 1fr 1fr;
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .page-title {
          align-items: flex-start;
        }
        .page-title .row {
          flex-wrap: wrap;
        }
        .bottom-bar {
          padding: 10px 14px;
          gap: 6px;
        }
        .bottom-bar small {
          max-width: 33%;
          font-size: 10px;
        }
        .list-wrap {
          overflow: auto;
        }
        .list-table {
          min-width: 720px;
        }
        .reader {
          height: 450px;
        }
        .brand {
          font-size: 17px;
        }
      }
      @media (max-width: 520px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        .reader {
          grid-template-columns: 112px minmax(0, 1fr);
        }
        .container {
          padding: 14px 10px 90px;
        }
        .header {
          padding: 0 12px;
        }
        .page-title {
          flex-wrap: wrap;
          gap: 12px;
        }
        .page-title h1 {
          font-size: 20px;
        }
        .page-title > .row {
          justify-content: flex-end;
        }
        .doc-controls {
          padding: 8px;
        }
        .tabs {
          gap: 20px;
        }
        .selection-grid {
          padding: 0 10px 10px;
        }
        .bottom-bar button {
          font-size: 12px;
          padding: 5px 8px;
        }
        .bottom-bar small {
          display: none;
        }
        .bottom-bar {
          justify-content: flex-end;
        }
        .stats {
          gap: 8px;
        }
        .stat {
          padding: 12px;
        }
        .paper {
          padding: 8px;
        }
      }
    </style>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="header">
      <a class="brand" href="#" id="brand">SunwiseMatriX TR</a>
      <nav class="main-nav" aria-label="主导航">
        <button id="dataset-nav" data-action="view:datasets">历史数据集</button>
        <button id="case-search-open" data-action="view:search">案例检索</button>
      </nav>
      <span class="grow"></span>
      <span class="avatar" aria-label="演示用户">林</span>
    </header>
    <main class="container" id="app"></main>
    <footer class="bottom-bar" id="bottom"></footer>
    <dialog class="dialog" id="dialog" aria-labelledby="dialog-title"></dialog>
    <main class="container" id="case-search" aria-labelledby="case-search-title" hidden>
      <h1 id="case-search-title">案例检索</h1>
      <div class="panel search-panel">
        <div id="case-search-log" role="log" aria-label="检索记录" tabindex="0">
          <div class="notice">输入源需求、设计描述或接口标识，检索使用中数据集的已确认案例。</div>
        </div>
        <form id="case-search-form">
          <div class="search-controls">
            <input id="case-search-query" type="search" aria-label="源需求或设计描述"
              aria-describedby="case-search-error" placeholder="例如 SJA1000">
            <button class="primary" type="submit">检索</button>
          </div>
          <p id="case-search-error" role="status"></p>
        </form>
      </div>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script id="sample-data" type="application/json">
      {
        "documents": [
          {
            "id": "srs",
            "dataset_id": "cnas",
            "name": "cnas需求规格说明书.docx",
            "role": "input",
            "type": "需求规格",
            "sha256": "734e47d0a6eaacb63a0ad9d79d243e643f531ac16c67fdc3759bbaa97a0bd89f",
            "parse_status": "SUCCEEDED",
            "sections": [
              { "id": "srs-init", "title": "3.2.1 初始化功能", "heading_locator": "body[107]" },
              { "id": "srs-80", "title": "3.2.1.1 80C32 控制器初始化", "heading_locator": "body[109]" },
              { "id": "srs-can", "title": "3.2.1.2 CAN 控制器初始化", "heading_locator": "body[114]" },
              { "id": "srs-da", "title": "3.2.1.3 DA 输出默认设置", "heading_locator": "body[122]" },
              { "id": "srs-reset", "title": "3.2.1.4 系统热复位初始化判读", "heading_locator": "body[128]" }
            ],
            "units": [
              {
                "id": "srs-b108",
                "kind": "paragraph",
                "section_id": "srs-init",
                "order": 10700,
                "text": "电池管理下位机软件启动或复位后，需首先完成系统初始化功能，初始化功能包括： 80C32 控制器初始化，CAN 控制器初始化、DA 输出默认设置初始化、端口初始化等。",
                "locator": "body[108]",
                "sha256": "5ab44c9a2381e0b3d736282220e5d1ece448a8a8d46c405889f52a5ee3b1078c"
              },
              {
                "id": "srs-b110",
                "kind": "paragraph",
                "section_id": "srs-80",
                "order": 10900,
                "text": "a.   配置中断使用：定时器 0、外部中断 0；其他未使用中断为使能禁止；",
                "locator": "body[110]",
                "sha256": "1a09637d0149b57691b520257b2f34b22ed1ec28efa43e93b49f21979d2ee316"
              },
              {
                "id": "srs-b111",
                "kind": "paragraph",
                "section_id": "srs-80",
                "order": 11000,
                "text": "b.   定时器 0 为高优先级；外部中断 0 为低优先级；",
                "locator": "body[111]",
                "sha256": "2678834b1b804903b173ca051753a4dd29b138d27868f5f180a396550335af4b"
              },
              {
                "id": "srs-b112",
                "kind": "paragraph",
                "section_id": "srs-80",
                "order": 11100,
                "text": "c.   定时器 0 定时周期为 10ms；",
                "locator": "body[112]",
                "sha256": "c51d989784ac6877b1f8343f982f3c6e455fe7994de7b055aed9b11eadd6dd18"
              },
              {
                "id": "srs-b113",
                "kind": "paragraph",
                "section_id": "srs-80",
                "order": 11200,
                "text": "d.   外部中断 0 设置为电平中断触发。",
                "locator": "body[113]",
                "sha256": "1ec5c156b0b3d39f214128e53598e575e9d1d0705c0edf977604dc912ab81364"
              },
              {
                "id": "srs-b115",
                "kind": "paragraph",
                "section_id": "srs-can",
                "order": 11400,
                "text": "a.   设置 SJA1000 进入复位模式，设置寄存器 0 值41H；",
                "locator": "body[115]",
                "sha256": "13e8e9cfdb43be3cbe79f533d5d4d3a7427d188f674aa6a2e3cdae4d57886bf3"
              },
              {
                "id": "srs-b116",
                "kind": "paragraph",
                "section_id": "srs-can",
                "order": 11500,
                "text": "b.   延时等待进入复位模式；",
                "locator": "body[116]",
                "sha256": "0de2f5125aea8285892b3f3d060dab7aa112593714b862f9068c1279bd8d6128"
              },
              {
                "id": "srs-b117",
                "kind": "paragraph",
                "section_id": "srs-can",
                "order": 11600,
                "text": "c.   根据总线数据 ID 定义设置 ACR、AMR 设置值，设置完成后可接收电池管理下位机自身节点 ID 数据（86H 或 46H）；",
                "locator": "body[117]",
                "sha256": "e413f9d3306d841d97fc8352c2ff6bd346961f22c6c186b9a35778af4914b2d2"
              },
              {
                "id": "srs-b118",
                "kind": "paragraph",
                "section_id": "srs-can",
                "order": 11700,
                "text": "d.   总线时序寄存器 0 配置值为 41H；总线时序寄存器 1 配置值为 C5H；",
                "locator": "body[118]",
                "sha256": "58a4a1e531484d37680039fa709dc64ad34bb3f24f71c169acb7dd684768dfe5"
              },
              {
                "id": "srs-b119",
                "kind": "paragraph",
                "section_id": "srs-can",
                "order": 11800,
                "text": "e.   控制输出寄存器设置值为 4AH；",
                "locator": "body[119]",
                "sha256": "d22495e4475dfd1fd3b8d8c4c03672fd0df7729cd4fd85cb4896df4cc65a07e0"
              },
              {
                "id": "srs-b120",
                "kind": "paragraph",
                "section_id": "srs-can",
                "order": 11900,
                "text": "f.    时钟分频器设置为 04H；",
                "locator": "body[120]",
                "sha256": "194ea5f8cac578a9b8f448c290f639e9570b1f3b8e21f2fca2179c29025a5ac3"
              },
              {
                "id": "srs-b121",
                "kind": "paragraph",
                "section_id": "srs-can",
                "order": 12000,
                "text": "g.   退出复位模式，使能总线接收中断、发送中断，其他中断类型均为禁止。",
                "locator": "body[121]",
                "sha256": "490dbb49206b06fe78a196c56da321a42b66dbd0929152d03d2140eb09b82d9e"
              },
              {
                "id": "srs-b123",
                "kind": "paragraph",
                "section_id": "srs-da",
                "order": 12200,
                "text": "系统上电或复位后，DA 输出默认设置为 1.28V，具体设置如下：",
                "locator": "body[123]",
                "sha256": "227033ef2859bee056c5eb96e198fad0dbb4ed9edb82c64003de1ddf738ca96a"
              },
              {
                "id": "srs-b124",
                "kind": "paragraph",
                "section_id": "srs-da",
                "order": 12300,
                "text": "VD/A 输出=（XXH/FFH） ×2.55（V）",
                "locator": "body[124]",
                "sha256": "acbd5a984b73e6ecd1b6d91c8467beac4a01c30560df420a2a6368216ea8db21"
              },
              {
                "id": "srs-b126",
                "kind": "paragraph",
                "section_id": "srs-da",
                "order": 12500,
                "text": "a.   充电电流设定电平系统上电后保持周期刷新输出；",
                "locator": "body[126]",
                "sha256": "c41204aed3dca5311e8276cf2b06afb9d06ecf7f9f7fde26a2ac5d124792fc8f"
              },
              {
                "id": "srs-b127",
                "kind": "paragraph",
                "section_id": "srs-da",
                "order": 12600,
                "text": "b.   充电电流设定电平设定值可通过上行注数功能修改。",
                "locator": "body[127]",
                "sha256": "dbda594478449d9b80d2510198b003ed292e91fc9b9daa7a82d27f1b9a103d5e"
              },
              {
                "id": "srs-b129",
                "kind": "paragraph",
                "section_id": "srs-reset",
                "order": 12800,
                "text": "软件启动后，依据热复位电路输入电压判断复位类型是冷复位还是热复位，判读依据如下：",
                "locator": "body[129]",
                "sha256": "db39b6575fc97a0ba27d92a7ea863b44c8084ee1990827ffbc9179c2c54678e7"
              },
              {
                "id": "srs-b130",
                "kind": "paragraph",
                "section_id": "srs-reset",
                "order": 12900,
                "text": "a. 设置端口 P1.4 为输入状态（使用前置 1）；",
                "locator": "body[130]",
                "sha256": "456d4c130995d3efa293e40dc6e57a40b56b515328f34d9171f63a2b7102c84e"
              },
              {
                "id": "srs-b131",
                "kind": "paragraph",
                "section_id": "srs-reset",
                "order": 13000,
                "text": "b. 系统上电后读取 P1.4 电平状态，若为高电平（1）则为热复位，系统热复位计数+1，有效计数范围为 0~15；如果为低电平（0），则为冷复位热复位计数清零。",
                "locator": "body[131]",
                "sha256": "6f02b67814bc5c51dc32a350f211952c9a1b389319ab30266d3abd569fe8447a"
              }
            ]
          },

              {
                "id": "mcu-b125",
                "kind": "paragraph",
                "section_id": "mcu-sfr",
                "order": 12400,
                "text": "高位地址部分地址从 80~ffH，有两组不同的物理存储器映射到这一地址，它们是内部 RAM 的高 128 字节和特殊功能寄存器。高 128 字节的 RAM 是低位RAM 区的扩展，用作数据缓冲器，以间接寻址的方式访问；特殊功能寄存器中包含了累加器ACC，寄存器 B、堆栈指针 SP、数据指针 DPTR 及程序状态字 PSW，它们是与指令执行紧密相关的数据寄存器和状态控制寄存器，支持寄存器寻址。此外，特殊功能寄存器中还包括各种片上设备的控制寄存器，指令对设备控制寄存器的数据进行操作可以完成片上设备的初始化与控制。地址为 8 的整数倍的特殊功能寄存器可以进行位寻址，位地址从 80~ffH，方便对微控制器和片上设备的状态进行控制。特殊功能寄存器的地址分配见表 6-2 。BSC80C32ERH 使用了 26 个特殊功能寄存器。",
                "locator": "body[125]",
                "sha256": "76695b47be6ddaf239460823cafdc317fac6e73e1f67f08610623bdf99c94fb6"
              },

            "id": "can",

            "sections": [
              {
                "id": "can-mode",
                "title": "6.2      Detailed description of the CAN controller",
                "heading_locator": "body[193]"
              },
              {
                "id": "can-layout",
                "title": "6.3.1      BASICCAN ADDRESS LAYOUT",
                "heading_locator": "body[248]"
              },
              { "id": "can-reset", "title": "6.3.2       RESET VALUES", "heading_locator": "body[285]" }
            ],
            "units": [
              {
                "id": "can-b194",
                "kind": "paragraph",
                "section_id": "can-mode",
                "order": 19300,
                "text": "The SJA1000 is designed to be software and",
                "locator": "body[194]",
                "sha256": "d566d4d146045efdd94f0890df9d432f2314a654d4043a67410f6a304f4f8d32"
              },
              {
                "id": "can-b195",
                "kind": "paragraph",
                "section_id": "can-mode",
                "order": 19400,
                "text": "pin-compatible to its predecessor, the PCA82C200",
                "locator": "body[195]",
                "sha256": "a2bfbb9637e3fb7b2da1ebe9a4b99214697461e8aef81285d00f254ed7f5fd2a"
              },
              {
                "id": "can-b196",
                "kind": "paragraph",
                "section_id": "can-mode",
                "order": 19500,
                "text": "stand-alone CAN controller. Additionally, a lot of new functions are implemented. To achieve the software compatibility, two different modes of operation are",
                "locator": "body[196]",
                "sha256": "ce79d943b80a5a03819c3fa039554bd9a0676676e874b2a7460195ce8cfcb28b"
              },
              {
                "id": "can-b197",
                "kind": "paragraph",
                "section_id": "can-mode",
                "order": 19600,
                "text": "implemented:",
                "locator": "body[197]",
                "sha256": "49c87bf8e04761703dba99d066f7cfa36ded5efa207c84372fe2972d847f06b1"
              },
              {
                "id": "can-b198",
                "kind": "paragraph",
                "section_id": "can-mode",
                "order": 19700,
                "text": "•  BasicCAN mode; PCA82C200 compatible",
                "locator": "body[198]",
                "sha256": "cd287efb90eba44eaf17c0df8d4c61a7134ac4ced3fc7d9a5107043097d574c7"
              },
              {
                "id": "can-b199",
                "kind": "paragraph",
                "section_id": "can-mode",
                "order": 19800,
                "text": "•  PeliCAN mode; extended features.",
                "locator": "body[199]",
                "sha256": "ab572f378706550829b6bbaf9a1ac63e26eeaea4451d5876daf66ecc09743459"
              },
              {
                "id": "can-b200",
                "kind": "paragraph",
                "section_id": "can-mode",
                "order": 19900,
                "text": "The mode of operation is selected with the CAN-mode bit located within the clock divider register. Default mode",
                "locator": "body[200]",
                "sha256": "569759de9e96e65d611be778a0c3ee9dcbd1c87dcf175005594d61e79eb78d28"
              },
              {
                "id": "can-b201",
                "kind": "paragraph",
                "section_id": "can-mode",
                "order": 20000,
                "text": "upon reset is the BasicCAN mode.",
                "locator": "body[201]",
                "sha256": "bbd1b118fc7757153b2bda724070964497315d58cfb725b63e515177b730322f"
              },
              {
                "id": "can-b249",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 24800,
                "text": "The SJA1000 appears to a microcontroller as a",
                "locator": "body[249]",
                "sha256": "1ac7b39b75983f772c4e312f35a04dba0b4abcba48d25bea4cc93929430e08ef"
              },
              {
                "id": "can-b250",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 24900,
                "text": "memory-mapped I/O device. An independent operation of both devices is guaranteed by a RAM-like implementation of the on-chip registers.",
                "locator": "body[250]",
                "sha256": "05d472fce00ebc6ba6309a69b351ef3306607f472f42165deee9be20b206051d"
              },
              {
                "id": "can-b251",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 25000,
                "text": "The address area of the SJA1000 consists of the control segment and the message buffers. The control segment is programmed during an initialization download in order to configure communication parameters (e.g. bit timing).",
                "locator": "body[251]",
                "sha256": "073ab8790ca7320adcbf2bd8e7fea0d2e8e453da22c2941d07a6e374dd651a18"
              },
              {
                "id": "can-b252",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 25100,
                "text": "Communication over the CAN-bus is also controlled via this segment by the microcontroller. During initialization the CLKOUT signal may be programmed to a value",
                "locator": "body[252]",
                "sha256": "b1404dd15f86016f85fe9d2dd4edf3ad32e87b4707b970d0f939042d9e6ba2dd"
              },
              {
                "id": "can-b253",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 25200,
                "text": "determined by the microcontroller.",
                "locator": "body[253]",
                "sha256": "8f2991377daa5b0008d234a38d94c19ec603a2d38e3cc8bd894e31ea6e02e9cd"
              },
              {
                "id": "can-b254",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 25300,
                "text": "A message, which should be transmitted, has to be written to the transmit buffer. After a successful reception the",
                "locator": "body[254]",
                "sha256": "9059375b7a04fe06ccd3fd854060b2c6167dfeb92ce730af4cf0ecc0bcc358c7"
              },
              {
                "id": "can-b255",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 25400,
                "text": "microcontroller may read the received message from the receive buffer and then release it for further use.",
                "locator": "body[255]",
                "sha256": "aa001c6e0109307cf15e9049552a5a1e9051be3a4d6d082eaa94aa0e0eaa00b2"
              },
              {
                "id": "can-b256",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 25500,
                "text": "The exchange of status, control and command signals",
                "locator": "body[256]",
                "sha256": "b4d484414c5c16217dd132a278a2373564ce318b9883b1e9be6528ad7ea225e3"
              },
              {
                "id": "can-b257",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 25600,
                "text": "between the microcontroller and the SJA1000 is",
                "locator": "body[257]",
                "sha256": "0e4c2da53b0df3fbcc4f3e390d3c711a06c1427e32bfc86b750f109d99ede852"
              },
              {
                "id": "can-b258",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 25700,
                "text": "performed in the control segment. The layout of this",
                "locator": "body[258]",
                "sha256": "188f1a10a668497e2625fa38446943192fc30a0b6225c307581bad4ef57b46ef"
              },
              {
                "id": "can-b259",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 25800,
                "text": "segment is shown in Table 3. After an initial download, the contents of the registers acceptance code, acceptance  mask, bus timing registers 0 and 1 and output control",
                "locator": "body[259]",
                "sha256": "e52ae21416827ee5e5485feba703e2ab7075c9d0603afd6433dffead2d813b0a"
              },
              {
                "id": "can-b260",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 25900,
                "text": "should not be changed. Therefore these registers may",
                "locator": "body[260]",
                "sha256": "3bc800475cce627e8be33f62a80372102894991a1afe6f190f685715e6344c02"
              },
              {
                "id": "can-b261",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 26000,
                "text": "only be accessed when the reset request bit in the control register is set HIGH.",
                "locator": "body[261]",
                "sha256": "96988b124c08a4d1d0c6f9dd022087d44851eeae673576d24971843a1b1427cb"
              },
              {
                "id": "can-b262",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 26100,
                "text": "For register access, two different modes have to be distinguished:",
                "locator": "body[262]",
                "sha256": "395cb3d591dddd0d2b036c97bb70b5428265f8e059ecdd40adbd81c8e5780aa1"
              },
              {
                "id": "can-b263",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 26200,
                "text": "•  Reset mode",
                "locator": "body[263]",
                "sha256": "12c06426be0cb92c7fcb23cf6e9db2f6a0e766fd10a178bd01e6e13b01976b9c"
              },
              {
                "id": "can-b264",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 26300,
                "text": "•  Operating mode.",
                "locator": "body[264]",
                "sha256": "9974dfdf2f48d14e1506fbf4e0283a211c7fd2327fbf77687208d9e6924365c4"
              },
              {
                "id": "can-b265",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 26400,
                "text": "The reset mode (see Table 3, control register, bit Reset Request) is entered automatically after a hardware reset or when the controller enters the bus-off state (see",
                "locator": "body[265]",
                "sha256": "144c147228bf54ac35a3380e2b71897c839ecbe59b177caf80dee17c2f8c3ef3"
              },
              {
                "id": "can-b266",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 26500,
                "text": "Table 5, status register, bit Bus Status). The operating",
                "locator": "body[266]",
                "sha256": "702a6c44a67538c28760c6ece9294865d0f98e2e34a480493a9694715a5efc37"
              },
              {
                "id": "can-b267",
                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 26600,
                "text": "mode is activated by resetting of the reset request bit in the control register.",
                "locator": "body[267]",
                "sha256": "ed33e1f17210179edb388145936b35f3f15d2bd45327d44b6096162ba10ee757"
              },

                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 27600,
                "text": "1.   It should be noted that the registers are repeated within higher CAN address areas (the most significant bits of the 8-bit CPU address are not decoded: CAN address 32 continues with CAN address 0 and so on).",

                "sha256": "f7b7660b6655c2d7be205d343dea5b6ea4ad4c531460264edf70051aa9b8b3ca"

                "kind": "paragraph",
                "section_id": "can-layout",
                "order": 27700,
                "text": "2.   Test register is used for production testing only. Using this register during normal operation may result in undesired behaviour of the device.",

                "section_id": "can-layout",
                "order": 27800,
                "text": "3.   Some bits are writeable in reset mode only (CAN mode and CBP).",

                "kind": "paragraph",
                "section_id": "can-reset",
                "order": 28500,
                "text": "Detection of a ‘reset request’ results in aborting the current transmission/reception of a message and entering the reset mode. On the ‘1-to-0’ transition of the reset request bit, the CAN controller returns to the operating mode.",

          url = URL.createObjectURL(blob);
        a.href = url;
        a.download = "历史数据集-演示案例-" + snapshot.slice(0, 10) + ".jsonl";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        closeModal();
        toast("已导出 " + records.length + " 个本地演示案例");
      }
      function locate(id) {
        let u = unit(id);
        if (!u) return;
        sideDoc[u.doc.role] = u.doc.id;
        sideSection[u.doc.role] = u.section_id;
        sideVersion[u.doc.role] = edit.versions?.[u.doc.id] || 1;
        searches[u.doc.role] = "";
        mobileSide = u.doc.role;
        renderWorkbench();
        document
          .getElementById("unit-" + (u.parent || id))
          ?.scrollIntoView({ block: "center", behavior: "smooth" });
      }
      function upload(side) {
        modal(
          "模拟上传 · " + (side === "input" ? "源需求／设计资料" : "人工测试需求"),
          `<div class="notice warn">本原型不解析新文件。选择文件仅演示校验和逐文件状态；不会读取、上传或替换文件内容。</div><div class="field"><label>文档类型</label><select id="upload-type">${(side === "input" ? ["需求规格", "设计说明", "接口协议", "其他"] : ["人工测试需求"]).map((t) => `<option>${t}</option>`).join("")}</select></div><div class="field"><label>DOCX 文件 · 演示限制：单文件 20 MB，每批最多 5 份</label><input id="upload-files" type="file" accept=".docx" multiple></div><small>格式、文件大小可本地检查；DOCX 包内容及资源限制需正式后端校验。</small>`,
          btn("取消", "close") + btn("模拟提交", "upload-final:" + side, "primary"),
        );
      }
      function changeState(id) {
        let c = db.cases.find((x) => x.id === id);
        if (!writable()) return;
        modal(
          c.status === "DISABLED" ? "恢复案例" : "停用案例",
          c.status === "DISABLED"
            ? "恢复后进入新草稿，必须再次确认才能供给。"
            : "停用后立即退出默认供给，已有历史和下载文件保留。",
          btn("取消", "close") + btn("确认", "state-final:" + id, "primary"),
        );
      }
      function newDataset(dataset) {
        modal(
          dataset ? "编辑数据集" : "新建历史数据集",
          `${[
            ["name", "数据集名称"],
            ["note", "备注"],
          ]
            .map(
              ([k, t]) =>
                `<div class="field"><label for="dataset-${k}">${k !== "note" ? '<span class="required">*</span>' : ""}${t}</label><input id="dataset-${k}" style="width:100%" value="${dataset ? esc(dataset[k]) : ""}"></div>`,
            )
            .join("")}`,
          btn("取消", "close") + btn("保存", "dataset-save:" + (dataset ? "edit:" + dataset.id : "new"), "primary"),
        );
      }
      // Controller: all write paths verify the local role and dataset state.
      const writeActions = new Set([
        "save",
        "confirm",
        "confirm-final",
        "new-case",
        "category",
        "remove",
        "group-up",
        "section-select",
        "upload",
        "upload-final",
        "retry",
        "disable",
        "state-final",
      ]);
      document.addEventListener("click", (e) => {
        let el = e.target.closest("[data-action]");
        if (!el || el.disabled) return;
        let action = el.dataset.action,
          [a, b, c] = action.split(":");
        if (writeActions.has(a) && !writable()) {
          toast("当前为只读状态");
          return;
        }
        switch (a) {
          case "close":
            closeModal();
            break;
          case "view":
            openView(b);
            break;
          case "new-case":
            newCase();
            break;
          case "case":
            openCase(b);
            break;
          case "save":
            save();
            break;
          case "confirm":
            requestConfirm();
            break;
          case "confirm-final":
            confirmFinal();
            break;
          case "preview":
            modal("配对预览 · 当前编辑", preview(edit));
            break;
          case "discard":
            closeModal();
            dirty = false;
            edit = clone(db.cases.find((c) => c.id === edit.id) || emptyCase(datasetId));
            expected = edit.revision;
            pendingLeave?.();
            break;
          case "save-leave":
            if (save()) {
              closeModal();
              pendingLeave?.();
            }
            break;
          case "reload-case":
            dirty = false;
            closeModal();
            openCase(edit.id);
            break;
          case "duplicate":
            dirty = false;
            closeModal();
            openCase(b);
            break;
          case "category":
            edit.test_categories = edit.test_categories.includes(b)
              ? edit.test_categories.filter((x) => x !== b)
              : [...edit.test_categories, b];
            markDirty();
            renderWorkbench();
            break;
          case "selection-expand":
            selectionOpen = !selectionOpen;
            renderWorkbench();
            break;
          case "remove": {
            const u = unit(b);
            if (u) {
              edit[u.doc.role] = edit[u.doc.role].filter((id) => id !== b);
              markDirty();
              renderWorkbench();
            }
            break;
          }
          case "group-up": {
            let i = edit.document_order.indexOf(b);
            if (i > 0) {
              [edit.document_order[i - 1], edit.document_order[i]] = [
                edit.document_order[i],
                edit.document_order[i - 1],
              ];
              markDirty();
              renderWorkbench();
            }
            break;
          }
          case "mobile":
            mobileSide = b;
            renderWorkbench();
            break;
          case "section":
            sideSection[b] = c;
            searches[b] = "";
            renderWorkbench();
            $("#paper-" + b).scrollTop = 0;
            break;
          case "section-select": {
            let d = doc(sideDoc[b]);
            if (edit[b].some((id) => unit(id)?.doc.id === d.id) && edit.versions[d.id] !== sideVersion[b]) {
              toast("请先移除该文档旧版本选区");
              break;
            }
            for (let u of d.units.filter((u) => u.section_id === sideSection[b] && u.kind !== "table_row")) {
              if (u.kind === "table") edit[b] = edit[b].filter((id) => unit(id)?.parent !== u.id);
              if (!edit[b].includes(u.id)) edit[b].push(u.id);
            }
            edit.versions[d.id] = sideVersion[b];
            if (!edit.document_order.includes(d.id)) edit.document_order.push(d.id);
            markDirty();
            renderWorkbench();
            break;
          }
          case "locate":
            locate(b);
            break;
          case "linked": {
            let u = unit(b);
            modal(
              "关联案例",
              cases()
                .filter((c) => c[u.doc.role].includes(b))
                .map(
                  (c) =>
                    `<div class="row spread" style="margin:10px 0"><span>${esc(c.title)}</span>${badge(c.status)}${btn("打开", "linked-open:" + c.id, "text")}</div>`,
                )
                .join(""),
            );
            break;
          }
          case "linked-open":
            closeModal();
            openCase(b);
            break;
          case "filter-datasets":
            datasetFilter = $("#dataset-filter").value;
            page = 1;
            render();
            break;
          case "filter-cases":
            caseFilter = $("#case-filter").value;
            caseStatus = $("#case-status").value;
            caseCategory = $("#case-category").value;
            caseObject = $("#case-object").value;
            caseInterface = $("#case-interface").value;
            caseScenario = $("#case-scenario").value;
            caseSince = $("#case-since").value;
            page = 1;
            render();
            break;
          case "prev":
            page = Math.max(1, page - 1);
            render();
            break;
          case "next":
            page++;
            render();
            break;
          case "dataset":
            datasetId = b;
            view = "documents";
            page = 1;
            edit = clone(
              cases()[0] || {
                id: uid("case"),
                dataset_id: b,
                title: "",
                test_object: "",
                test_categories: [],
                input: [],
                output: [],
                document_order: [],
                versions: {},
                revision: 0,
                status: "DRAFT",
                history: [],
                audit: [],
              },
            );
            expected = edit.revision;
            render();
            break;
          case "new-dataset":
            newDataset();
            break;
          case "edit-dataset": {
            const dataset = db.datasets.find((item) => item.id === b);
            if (dataset?.status === "ACTIVE") newDataset(dataset);
            break;
          }
          case "dataset-save": {
            const dataset = db.datasets.find((item) => item.id === c);
            if (b === "edit" && dataset?.status !== "ACTIVE") break;
            let values = {};
            for (let k of ["name", "note"])
              values[k] = $("#dataset-" + k).value.trim();
            if (!values.name) {
              toast("请填写数据集名称");
              break;
            }
            if (b === "edit") Object.assign(dataset, values, { updated_at: now() });
            else db.datasets.push({ ...values, id: uid("dataset"), status: "ACTIVE", updated_at: now() });
            persist();
            closeModal();
            render();
            toast("数据集已保存到本地");
            break;
          }
          case "delete-dataset": {
            const dataset = db.datasets.find((item) => item.id === b);
            if (!dataset) break;
            modal(
              "删除数据集",
              `<p>确定永久删除 <b>${esc(dataset.name)}</b>？该数据集的文档、案例和历史记录将一并删除，无法恢复。</p>`,
              btn("取消", "close") + btn("永久删除", "delete-dataset-final:" + b, "danger"),
            );
            break;
          }
          case "delete-dataset-final": {
            if (!db.datasets.some((item) => item.id === b)) break;
            const next = {
              ...db,
              datasets: db.datasets.filter((item) => item.id !== b),
              documents: db.documents.filter((item) => item.dataset_id !== b),
              cases: db.cases.filter((item) => item.dataset_id !== b),
            };
            try {
              localStorage.setItem(KEY, JSON.stringify(next));
            } catch {
              $("#dataset-delete-error")?.remove();
              $("#dialog .dialog-body").insertAdjacentHTML("beforeend",
                '<p class="notice error" id="dataset-delete-error" role="alert">保存失败，数据集仍在。请重试。</p>');
              break;
            }
            db = next;
            removeDatasetSearchResults(b);
            if (datasetId === b) {
              datasetId = null;
              edit = emptyCase(null);
              expected = 0;
            }
            page = 1;
            closeModal();
            render();
            toast("数据集已删除");
            break;
          }
          case "doc-preview": {
            let d = doc(b);
            modal(
              "原文结构摘录 · " + esc(d.name),
              `<div class="notice">真实 DOCX 精选摘录，不是完整 Word 排版预览。定位为 word/document.xml 的直接 body 子节点（从 1 起）。</div>${d.sections
                .map(
                  (s) =>
                    `<h3 style="margin:18px 0 8px">${esc(s.title)}</h3>${d.units
                      .filter((u) => u.section_id === s.id && u.kind !== "table_row")
                      .map(
                        (u) =>
                          `<div class="preview-unit"><small>${esc(u.locator)}</small>${u.kind === "table" ? tableHtml({ ...u, doc: d }, false) : `<p class="prose">${esc(u.text)}</p>`}</div>`,
                      )
                      .join("")}`,
                )
                .join("")}`,
            );
            break;
          }
          case "upload":
            upload(b);
            break;
          case "upload-final": {
            let files = [...$("#upload-files").files];
            if (!files.length) {
              toast("请选择 DOCX 文件");
              break;
            }
            if (files.length > 5) {
              toast("演示限制：每批最多 5 份");
              break;
            }
            let results = [];
            for (let f of files) {
              if (!/\.docx$/i.test(f.name) || f.size > 20 * 1024 * 1024) {
                results.push(esc(f.name) + "：格式或大小不符合限制");
                continue;
              }
              if (docs(b).some((d) => d.name === f.name)) {
                results.push(esc(f.name) + "：同名文件未覆盖（原型不判断内容哈希）");
                continue;
              }
              db.documents.push({
                id: uid("doc"),
                dataset_id: datasetId,
                name: f.name,
                role: b,
                type: $("#upload-type").value,
                parse_status: "FAILED",
                error: "模拟：离线原型未接入解析服务；实际文件内容未读取",
                sections: [],
                units: [],
                simulated: true,
              });
              results.push(esc(f.name) + "：已创建模拟失败记录");
            }
            persist();
            render();
            modal("逐文件模拟结果", results.map((t) => `<p style="margin:10px 0">${t}</p>`).join(""));
            break;
          }
          case "retry": {
            let d = doc(b);
            d.parse_status = "QUEUED";
            persist();
            render();
            let captured = d;
            setTimeout(() => {
              captured.parse_status = captured.units.length ? "SUCCEEDED" : "FAILED";
              captured.error = "模拟：未接入 DOCX 解析服务，未发布结构；请使用已有样例";
              persist();
              render();
              toast(captured.units.length ? "样例解析恢复成功（模拟）" : "无样例结构，未开放标注");
            }, 800);
            break;
          }
          case "delete-doc": {
            if (!writable()) break;
            let referenced = db.cases.filter((c) =>
              [...c.history, c].some((v) => [...v.input, ...v.output].some((id) => unit(id)?.doc.id === b)),
            );
            if (referenced.length) {
              modal(
                "文档受到历史引用保护",
                `不能删除被案例当前或历史版本引用的文档：${referenced.map((c) => `<p>${esc(c.title)}</p>`).join("")}`,
              );
              break;
            }
            modal(
              "删除未引用文档",
              "仅删除本地演示记录，不删除磁盘原文件。",
              btn("取消", "close") + btn("删除", "delete-doc-final:" + b, "danger"),
            );
            break;
          }
          case "delete-doc-final":
            if (writable()) {
              db.documents = db.documents.filter((d) => d.id !== b);
              persist();
              closeModal();
              render();
            }
            break;
          case "detail":
            modal("案例详情", preview(db.cases.find((c) => c.id === b)));
            break;
          case "disable":
            changeState(b);
            break;
          case "state-final": {
            let c = db.cases.find((x) => x.id === b);
            c.history.push({ ...clone(c), history: [] });
            c.revision++;
            c.status = c.status === "DISABLED" ? "DRAFT" : "DISABLED";
            c.confirmed_at = null;
            c.confirmed_by = null;
            c.updated_at = now();
            c.audit.push({ at: now(), action: labels[c.status], actor: "本地用户" });
            if (edit.id === c.id) {
              edit = clone(c);
              expected = c.revision;
            }
            persist();
            closeModal();
            render();
            break;
          }
          case "delete-case": {
            let c = db.cases.find((c) => c.id === b);
            if (

              !writable() ||
              c.status !== "DRAFT" ||
              c.history.some((h) => h.status === "CONFIRMED")
            )
              break;
            modal(
              "删除未确认草稿",
              "删除仅在本地生效；已有确认历史的案例不可硬删除。",
              btn("取消", "close") + btn("删除草稿", "delete-case-final:" + b, "danger"),
            );
            break;
          }
          case "delete-case-final":
            if (writable()) {
              let c = db.cases.find((c) => c.id === b);
              if (c.status === "DRAFT" && !c.history.some((h) => h.status === "CONFIRMED")) {
                db.cases = db.cases.filter((c) => c.id !== b);
                if (edit.id === b) {
                  edit = emptyCase(datasetId);
                  expected = 0;
                  dirty = false;
                }
              }
              persist();
              closeModal();
              render();
            }
            break;
          case "export":
            showExport();
            break;
          case "export-final":
            exportFinal();
            break;
        }
      });
      document.addEventListener("change", (e) => {
        let t = e.target;
        if (t.dataset.unit) {
          toggleUnit(t.dataset.unit);
          return;
        }
        if (t.dataset.doc) {
          let side = t.dataset.doc;
          sideDoc[side] = t.value;
          sideSection[side] = doc(t.value).sections[0]?.id;
          sideVersion[side] = edit.versions?.[t.value] || activeVersion(doc(t.value));
          searches[side] = "";
          renderWorkbench();
          $("#paper-" + side).scrollTop = 0;
        }
      });
      document.addEventListener("input", (e) => {
        let t = e.target;
        if (t.dataset.field && writable()) {
          edit[t.dataset.field] = t.value;
          markDirty();
        }
        if (t.dataset.search) {
          let side = t.dataset.search,
            pos = t.selectionStart;
          searches[side] = t.value;
          renderWorkbench();
          let input = document.querySelector('[data-search="' + side + '"]');
          input.focus();
          input.setSelectionRange(pos, pos);
        }
      });
      document.addEventListener("keydown", (e) => {
        if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button]")) {
          e.preventDefault();
          e.target.click();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === "s" && view === "workbench") {
          e.preventDefault();
          save();
        }
      });
      $("#brand").onclick = (e) => {
        e.preventDefault();
        openView("datasets");
      };
      window.addEventListener("beforeunload", (e) => {
        if (dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      $("#dialog").addEventListener("close", () => lastFocus?.focus?.());
      render();
    </script>
    <script src="app.js"></script>
  </body>
</html>
